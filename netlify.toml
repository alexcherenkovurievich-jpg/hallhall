# Настройки деплоя на Netlify.
# Сайт статический: HTML, CSS и JS отдаются как есть, поэтому
# команды сборки нет — только каталог публикации.

[build]
  # Публикуем корень репозитория: index.html лежит именно там.
  publish = "."

  # Команда сборки намеренно пустая. Собирать нечего:
  # ни npm, ни препроцессоров в проекте нет.
  command = ""

# Заголовки безопасности. К внешнему виду сайта отношения не имеют,
# но закрывают базовые претензии сканеров и почтовых фильтров.
[[headers]]
  for = "/*"

  [headers.values]
    # Запрет встраивать сайт в чужой iframe (защита от кликджекинга)
    X-Frame-Options = "SAMEORIGIN"

    # Браузер не пытается угадывать тип файла вопреки заголовку
    X-Content-Type-Options = "nosniff"

    # При переходе по внешней ссылке отдаём только домен, не полный адрес
    Referrer-Policy = "strict-origin-when-cross-origin"

# Шрифты и иконки не меняются между деплоями — их можно кэшировать
# надолго. HTML, CSS и JS намеренно не кэшируем агрессивно: иначе
# после правки текста посетители ещё сутки видели бы старую версию.
[[headers]]
  for = "/*.woff2"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
